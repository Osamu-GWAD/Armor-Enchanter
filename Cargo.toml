[package]
name = "Enchanter"
version = "0.1.0"
edition = "2024"

[dependencies]
azalea = "0.16.0"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"
azalea-auth = "0.16.0"
azalea-registry = "0.16.0"
azalea-inventory = "0.16.0"
reqwest = "0.13"
dotenvy = "0.15"


