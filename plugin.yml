name: CrackedAuth
version: 1.0.0
main: me.ash.crackauth.CrackedAuthPlugin
api-version: '1.21'
author: Ash
description: Password authentication for offline-mode Paper servers.
commands:
  register:
    description: Register your Minecraft username with a password.
    usage: /register <password> <password>
  login:
    description: Authenticate your Minecraft username.
    usage: /login <password>
  logout:
    description: End your current authentication session.
    usage: /logout
permissions:
  crackauth.admin:
    description: Manage CrackedAuth.
    default: op
